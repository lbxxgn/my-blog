{% extends "base.html" %}

{% block title %}回顾 - {{ site_name }}{% endblock %}

{% block page_type %}review{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ static_file('css/review.css') }}">
{% endblock %}

{% block content %}
<div class="container review-page">
    <div class="review-header">
        <h2>📖 回顾</h2>
        <p class="review-subtitle">看看过去写下的东西，偶遇被遗忘的灵感。</p>
    </div>

    <!-- 写作热力图 -->
    <section class="review-section">
        <div class="review-section-header">
            <h3>✍️ 写作热力</h3>
            <div class="heatmap-stats" id="heatmap-stats"></div>
        </div>
        <div class="heatmap-wrap">
            <div class="heatmap" id="heatmap" role="img" aria-label="近一年写作活动热力图"></div>
            <div class="heatmap-legend">
                <span>少</span>
                <i class="hm-cell"></i>
                <i class="hm-cell lv1"></i>
                <i class="hm-cell lv2"></i>
                <i class="hm-cell lv3"></i>
                <i class="hm-cell lv4"></i>
                <span>多</span>
            </div>
        </div>
    </section>

    <!-- 那年今日 -->
    <section class="review-section">
        <div class="review-section-header">
            <h3>🕰️ 那年今日</h3>
        </div>
        <div id="today-list" class="review-list">
            <p class="review-empty">加载中…</p>
        </div>
    </section>

    <!-- 每周回顾 -->
    <section class="review-section">
        <div class="review-section-header">
            <h3>🗓️ 每周回顾</h3>
            <button type="button" id="weekly-generate" class="btn btn-sm btn-primary">立即生成本周回顾</button>
        </div>
        <div id="weekly-status" class="weekly-status u-hidden" ></div>
        <div id="weekly-list" class="review-list">
            <p class="review-empty">加载中…</p>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ static_file('js/review.js') }}"></script>
{% endblock %}
