{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="{{ static_file('css/post-password.css') }}">
{% endblock %}


{% block title %}{{ post.title }} - 需要密码访问{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin-top: 3rem; margin-bottom: 3rem;">
    <div class="password-protected-card">
        <div class="lock-icon">🔒</div>

        <h1 style="text-align: center; margin-bottom: 0.5rem;">{{ post.title }}</h1>

        <div style="text-align: center; margin-bottom: 2rem;">
            <span class="badge-private">密码保护</span>
        </div>

        <div class="password-form">
            <p style="text-align: center; color: var(--text-secondary, #666); margin-bottom: 1.5rem;">
                这篇文章受密码保护，需要输入正确密码才能查看内容
            </p>

            <form id="passwordForm" onsubmit="verifyPassword(event)">
                <div class="form-group">
                    <label for="password">访问密码</label>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="请输入访问密码"
                           required
                           autofocus
                           autocomplete="off">
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span id="btnText">验证密码</span>
                    <span id="btnSpinner" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" opacity="0.25"></circle>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1">
                                <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
                            </path>
                        </svg>
                        验证中...
                    </span>
                </button>
            </form>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="{{ url_for('blog.index') }}" class="btn">返回首页</a>
        </div>
    </div>
</div>


<script>
async function verifyPassword(event) {
    event.preventDefault();

    const form = event.target;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMessage');
    const btn = form.querySelector('button[type="submit"]');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    // Reset error
    errorDiv.style.display = 'none';

    // Show loading state
    btn.disabled = true;
    btnText.style.display = 'none';
    btnSpinner.style.display = 'inline-flex';

    try {
        const response = await fetch('/post/{{ post.id }}/verify-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('meta[name="csrf_token"]')?.content || ''
            },
            body: JSON.stringify({ password: password })
        });

        const data = await response.json();

        if (data.success) {
            // Password verified, redirect to post
            window.location.href = data.redirect;
        } else {
            // Show error
            errorDiv.textContent = data.message || '密码验证失败';
            errorDiv.style.display = 'block';

            // Clear password
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    } catch (error) {
        console.error('Error:', error);
        errorDiv.textContent = '网络错误，请重试';
        errorDiv.style.display = 'block';
    } finally {
        // Reset button state
        btn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
    }
}

// Prevent form resubmission on page refresh
if (window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
}
</script>
{% endblock %}
