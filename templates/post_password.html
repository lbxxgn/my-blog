{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="{{ static_file('css/post-password.css') }}">
{% endblock %}

{% block scripts %}
<script defer src="{{ static_file('js/post-password.js') }}"></script>
{% endblock %}


{% block title %}{{ post.title }} - 需要密码访问{% endblock %}

{% block content %}
<div class="container container pw-page">
    <div class="password-protected-card">
        <div class="lock-icon">🔒</div>

        <h1 class="pw-title">{{ post.title }}</h1>

        <div class="pw-badge-row">
            <span class="badge-private">密码保护</span>
        </div>

        <div class="password-form">
            <p class="pw-intro">
                这篇文章受密码保护，需要输入正确密码才能查看内容
            </p>

            <form id="passwordForm" data-verify-url="{{ url_for('blog.verify_post_password_route', post_id=post.id) }}">
                <div class="form-group">
                    <label for="password">访问密码</label>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="请输入访问密码"
                           required
                           autofocus
                           autocomplete="off">
                </div>

                <div id="errorMessage" class="error-message u-hidden" ></div>

                <button type="submit" class="btn btn-primary btn btn-primary pw-submit">
                    <span id="btnText">验证密码</span>
                    <span class="u-hidden" id="btnSpinner" >
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" opacity="0.25"></circle>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1">
                                <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
                            </path>
                        </svg>
                        验证中...
                    </span>
                </button>
            </form>
        </div>

        <div class="pw-back">
            <a href="{{ url_for('blog.index') }}" class="btn">返回首页</a>
        </div>
    </div>
</div>


{% endblock %}
