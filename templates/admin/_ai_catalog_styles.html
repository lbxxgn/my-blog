<style>
.ai-section {
    background: var(--card-bg, #fff);
    border: 1px solid var(--border-color, #e5e7eb);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
}

.ai-section h3 {
    margin: 0 0 0.35rem 0;
    font-size: 1.2rem;
    color: var(--text-color, #1f2937);
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.25rem;
    margin-bottom: 1.25rem;
}

.section-heading .btn {
    white-space: nowrap;
}

.section-description {
    margin: 0;
    color: var(--text-secondary, #6b7280);
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 720px;
}

.table-toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 0.9rem;
    font-size: 0.9rem;
    color: var(--text-secondary, #6b7280);
}

.table-toolbar select {
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--border-color, #e5e7eb);
    border-radius: 7px;
    background: var(--input-bg, #fff);
    color: var(--text-color, #1f2937);
}

.muted {
    color: var(--text-secondary, #6b7280);
    font-size: 0.85rem;
}

.table-wrap {
    overflow-x: auto;
    border-radius: 10px;
}

.catalog-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
}

.catalog-table--providers {
    min-width: 940px;
}

.catalog-table--models {
    min-width: 680px;
}

.catalog-table th,
.catalog-table td {
    padding: 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border-color, #e5e7eb);
    vertical-align: middle;
}

.catalog-table th {
    font-weight: 600;
    color: var(--text-color, #1f2937);
    background: var(--code-bg, #f9fafb);
    white-space: nowrap;
}

.catalog-table tr:last-child td {
    border-bottom: none;
}

.catalog-table tbody tr {
    transition: background-color 0.15s ease;
}

.catalog-table tbody tr:hover {
    background: rgba(26, 188, 156, 0.04);
}

.catalog-table .actions {
    display: flex;
    gap: 0.4rem;
    flex-wrap: nowrap;
}

.catalog-table--providers th:nth-child(2),
.catalog-table--providers td:nth-child(2),
.catalog-table--providers th:nth-child(4),
.catalog-table--providers td:nth-child(4),
.catalog-table--providers th:nth-child(5),
.catalog-table--providers td:nth-child(5),
.catalog-table--providers th:nth-child(6),
.catalog-table--providers td:nth-child(6),
.catalog-table--providers th:nth-child(7),
.catalog-table--providers td:nth-child(7),
.catalog-table--models th:nth-child(3),
.catalog-table--models td:nth-child(3),
.catalog-table--models th:nth-child(4),
.catalog-table--models td:nth-child(4) {
    white-space: nowrap;
}

.catalog-table--providers td:nth-child(3) {
    max-width: 260px;
}

.catalog-table--providers td:nth-child(3) .model-id {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    word-break: normal;
}

.catalog-table .btn {
    padding: 0.3rem 0.65rem;
    font-size: 0.8rem;
}

.name-cell {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
}

.name-cell strong {
    color: var(--text-color, #1f2937);
}

.model-id {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.82rem;
    color: var(--text-secondary, #6b7280);
    word-break: break-all;
}

.badge {
    display: inline-block;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    font-size: 0.75rem;
    border: 1px solid var(--border-color, #e5e7eb);
    color: var(--text-secondary, #6b7280);
    white-space: nowrap;
}

.badge-on {
    color: #047857;
    border-color: #10b981;
    background: rgba(16, 185, 129, 0.1);
}

.badge-off {
    color: #b45309;
    border-color: #f59e0b;
    background: rgba(245, 158, 11, 0.1);
}

.badge-default {
    color: #1d4ed8;
    border-color: #3b82f6;
    background: rgba(59, 130, 246, 0.1);
}

.badge-builtin {
    color: #6d28d9;
    border-color: #8b5cf6;
    background: rgba(139, 92, 246, 0.1);
}

.badge-stack {
    display: inline-flex;
    flex-wrap: nowrap;
    gap: 0.3rem;
}

.empty-row {
    color: var(--text-secondary, #6b7280);
    text-align: center;
    padding: 1.5rem !important;
}

/* Toast */
.catalog-message {
    position: fixed;
    top: 84px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3000;
    width: min(520px, calc(100% - 2rem));
    padding: 0.85rem 1rem;
    border-radius: 10px;
    font-size: 0.9rem;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
}

.catalog-message.success {
    background: #d1fae5;
    color: #065f46;
    border: 1px solid #10b981;
}

.catalog-message.error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #ef4444;
}

/* Dialog */
.catalog-dialog {
    width: min(720px, calc(100% - 2rem));
    max-height: 90vh;
    margin: auto;
    padding: 0;
    text-align: left;
    border: none;
    border-radius: 14px;
    background: var(--card-bg, #fff);
    color: var(--text-color, #1f2937);
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.3);
}

.catalog-dialog::backdrop {
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(2px);
}

.catalog-dialog form {
    display: flex;
    flex-direction: column;
    max-height: 90vh;
}

.dialog-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--border-color, #e5e7eb);
}

.dialog-header h3 {
    margin: 0;
    font-size: 1.15rem;
    color: var(--text-color, #1f2937);
}

.dialog-subtitle {
    margin: 0.3rem 0 0 0;
    font-size: 0.85rem;
    color: var(--text-secondary, #6b7280);
    line-height: 1.4;
}

.dialog-close {
    border: none;
    background: transparent;
    color: var(--text-secondary, #6b7280);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 0.25rem;
}

.dialog-close:hover {
    color: var(--text-color, #1f2937);
}

.catalog-dialog select,
.catalog-dialog option {
    text-align: left;
}

.dialog-body {
    padding: 1.25rem 1.5rem;
    overflow-y: auto;
}

.dialog-error {
    margin-bottom: 1rem;
    padding: 0.7rem 0.85rem;
    border-radius: 8px;
    background: #fee2e2;
    border: 1px solid #ef4444;
    color: #991b1b;
    font-size: 0.88rem;
    line-height: 1.4;
}

.dialog-footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-color, #e5e7eb);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
}

.form-field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}

.form-field-wide {
    grid-column: 1 / -1;
}

.form-field label {
    font-weight: 500;
    color: var(--text-color, #1f2937);
    font-size: 0.9rem;
}

.form-field input,
.form-field select {
    width: 100%;
    box-sizing: border-box;
    padding: 0.6rem 0.7rem;
    border: 1px solid var(--border-color, #e5e7eb);
    border-radius: 7px;
    background: var(--input-bg, #fff);
    color: var(--text-color, #1f2937);
    font-size: 0.95rem;
}

.form-field input[type="checkbox"],
.form-field input[type="radio"] {
    width: auto;
    min-width: 1rem;
    min-height: 1rem;
    flex: 0 0 auto;
    padding: 0;
    margin: 0;
}

.form-field input[readonly],
.form-field select:disabled {
    background: var(--code-bg, #f3f4f6);
    color: var(--text-secondary, #6b7280);
    cursor: not-allowed;
}

.form-field small {
    color: var(--text-secondary, #6b7280);
    font-size: 0.78rem;
    line-height: 1.4;
}

.checkbox-column {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    padding-top: 0.15rem;
}

.checkbox-column label {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0.4rem;
    text-align: left;
    font-weight: 400;
    font-size: 0.88rem;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* Dark theme */
.dark-theme .ai-section,
.dark-theme .catalog-dialog {
    background: #1f2937;
    border-color: #374151;
}

.dark-theme .form-field input,
.dark-theme .form-field select,
.dark-theme .table-toolbar select {
    background: #1f2937;
    border-color: #4b5563;
    color: #f9fafb;
}

.dark-theme .form-field input[readonly],
.dark-theme .form-field select:disabled {
    background: #374151;
}

.dark-theme .catalog-table th {
    background: #374151;
}

@media (max-width: 640px) {
    .section-heading {
        flex-direction: column;
        align-items: stretch;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .catalog-dialog {
        width: calc(100% - 1rem);
    }
}
</style>
