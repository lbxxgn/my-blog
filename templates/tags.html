{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="{{ static_file('css/tags.css') }}">
{% endblock %}


{% block title %}全部标签 - {{ site_name }}{% endblock %}

{% block content %}
<main class="container">
    <h1 class="tags-title">全部标签</h1>

    {% if tags %}
    <div class="tags-cloud">
        {% for tag in tags %}
        <a href="{{ url_for('blog.view_tag', tag_id=tag.id) }}" class="tag-cloud-item">
            #{{ tag.name }}
            <span class="tag-count">({{ tag.post_count }})</span>
        </a>
        {% endfor %}
    </div>


    {% else %}
    <div class="tags-empty">
        <p>暂无标签</p>
    </div>
    {% endif %}
</main>
{% endblock %}
